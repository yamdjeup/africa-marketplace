name: Import designers simu

on:
  workflow_dispatch:
    inputs:
      action:
        description: "import = importer/mettre à jour les créateurs d'illustration ; remove = les supprimer (avant prod)"
        type: choice
        options: [import, remove]
        default: import

permissions:
  contents: read

jobs:
  designers:
    runs-on: ubuntu-latest
    env:
      SIMU_DATABASE_URL: ${{ secrets.SIMU_DATABASE_URL }}
      PROD_DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Vérifier le secret (base SIMU uniquement)
        run: |
          test -n "$SIMU_DATABASE_URL" || { echo "Secret SIMU_DATABASE_URL absent"; exit 1; }
          test "$SIMU_DATABASE_URL" != "$PROD_DATABASE_URL" || { echo "REFUS : SIMU_DATABASE_URL = production"; exit 1; }
      - run: npm ci
      - name: Générer le client PostgreSQL et appliquer les migrations sur simu (idempotent)
        env:
          DATABASE_URL: ${{ secrets.SIMU_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.SIMU_DATABASE_URL }}
        run: node scripts/db.mjs deploy
      - name: Importer les designers
        if: ${{ inputs.action == 'import' }}
        run: npm run db:simu-designers
      - name: Retirer les designers
        if: ${{ inputs.action == 'remove' }}
        run: npm run db:simu-designers -- --remove
