name: Sweep commandes (17TRACK)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Appel /api/orders/sweep
        env:
          SWEEP_URL: ${{ secrets.SWEEP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$SWEEP_URL" && test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SWEEP_URL/api/orders/sweep"
