# Postgres jetable pour les tests : docker compose -f docker-compose.test.yml up -d
# TEST_DATABASE_URL=postgresql://test:test@localhost:54329/epomta_test
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: epomta_test
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
